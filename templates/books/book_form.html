{% extends 'base.html' %}


{% block title %}
Add Book - Book Management
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="mb-4">
                    Add New Book
                </h2>


                <!-- Error Message -->
                <div
                    id="error-message"
                    class="alert alert-danger d-none">
                </div>


                <!-- Success Message -->
                <div
                    id="success-message"
                    class="alert alert-success d-none">
                </div>


                <form id="book-form">

                    {% csrf_token %}


                    <!-- Title -->
                    <div class="mb-3">

                        <label
                            for="title"
                            class="form-label">
                            Title
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            name="title"
                            required
                        >

                    </div>


                    <!-- Author -->
                    <div class="mb-3">

                        <label
                            for="author"
                            class="form-label">
                            Author
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="author"
                            name="author"
                            required
                        >

                    </div>


                    <!-- Category -->
                    <div class="mb-3">

                        <label
                            for="category"
                            class="form-label">
                            Category
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="category"
                            name="category"
                            required
                        >

                    </div>


                    <!-- Price -->
                    <div class="mb-3">

                        <label
                            for="price"
                            class="form-label">
                            Price
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="price"
                            name="price"
                            step="0.01"
                            min="0"
                            required
                        >

                    </div>


                    <!-- Published Date -->
                    <div class="mb-3">

                        <label
                            for="published_date"
                            class="form-label">
                            Published Date
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="published_date"
                            name="published_date"
                            required
                        >

                    </div>


                    <!-- Buttons -->
                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="submit-button">

                            Add Book

                        </button>


                        <a
                            href="{% url 'book_list' %}"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script>

const form =
    document.getElementById('book-form');

const errorMessage =
    document.getElementById('error-message');

const successMessage =
    document.getElementById('success-message');

const submitButton =
    document.getElementById('submit-button');


form.addEventListener('submit', function (event) {

    event.preventDefault();


    /*
     * Get JWT access token from localStorage.
     */

    const accessToken =
        localStorage.getItem('access_token');


    /*
     * If there is no access token,
     * send the user to login.
     */

    if (!accessToken) {

        window.location.href =
            "{% url 'login' %}";

        return;
    }


    /*
     * Collect form data.
     */

    const bookData = {

        title:
            document.getElementById('title').value,

        author:
            document.getElementById('author').value,

        category:
            document.getElementById('category').value,

        price:
            document.getElementById('price').value,

        published_date:
            document.getElementById('published_date').value

    };


    /*
     * Disable button while request is running.
     */

    submitButton.disabled = true;

    submitButton.textContent =
        'Adding...';


    /*
     * Send POST request to REST API.
     */

    fetch('/books/', {

        method: 'POST',

        headers: {

            'Content-Type':
                'application/json',

            'Authorization':
                'Bearer ' + accessToken

        },

        body:
            JSON.stringify(bookData)

    })


    /*
     * Process API response.
     */

    .then(async response => {

        const data =
            await response.json();


        /*
         * JWT expired or invalid.
         */

        if (response.status === 401) {

            localStorage.removeItem(
                'access_token'
            );

            localStorage.removeItem(
                'refresh_token'
            );

            window.location.href =
                "{% url 'login' %}";

            return;
        }


        /*
         * Other API errors.
         */

        if (!response.ok) {

            throw new Error(
                JSON.stringify(data)
            );
        }


        return data;

    })


    /*
     * Book successfully created.
     */

    .then(data => {

        successMessage.textContent =
            'Book added successfully!';

        successMessage.classList.remove(
            'd-none'
        );

        errorMessage.classList.add(
            'd-none'
        );


        form.reset();


        /*
         * Go back to book list.
         */

        setTimeout(() => {

            window.location.href =
                "{% url 'book_list' %}";

        }, 1000);

    })


    /*
     * Handle errors.
     */

    .catch(error => {

        console.error(error);


        errorMessage.textContent =
            'Failed to add book. Please check the entered data.';


        errorMessage.classList.remove(
            'd-none'
        );


        successMessage.classList.add(
            'd-none'
        );

    })


    /*
     * Enable button again.
     */

    .finally(() => {

        submitButton.disabled = false;

        submitButton.textContent =
            'Add Book';

    });

});

</script>

{% endblock %}
