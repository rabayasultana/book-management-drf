{% extends 'base.html' %}


{% block title %}
Edit Book - {{ book.title }}
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="mb-4">
                    Edit Book
                </h2>


                <div
                    id="error-message"
                    class="alert alert-danger d-none">
                </div>


                <div
                    id="success-message"
                    class="alert alert-success d-none">
                </div>


                <form id="book-edit-form">

                    {% csrf_token %}


                    <!-- Title -->

                    <div class="mb-3">

                        <label
                            for="title"
                            class="form-label">
                            Title
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            value="{{ book.title }}"
                            required
                        >

                    </div>


                    <!-- Author -->

                    <div class="mb-3">

                        <label
                            for="author"
                            class="form-label">
                            Author
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="author"
                            value="{{ book.author }}"
                            required
                        >

                    </div>


                    <!-- Category -->

                    <div class="mb-3">

                        <label
                            for="category"
                            class="form-label">
                            Category
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="category"
                            value="{{ book.category }}"
                            required
                        >

                    </div>


                    <!-- Price -->

                    <div class="mb-3">

                        <label
                            for="price"
                            class="form-label">
                            Price
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="price"
                            value="{{ book.price }}"
                            step="0.01"
                            min="0"
                            required
                        >

                    </div>


                    <!-- Published Date -->

                    <div class="mb-3">

                        <label
                            for="published_date"
                            class="form-label">
                            Published Date
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="published_date"
                            value="{{ book.published_date|date:'Y-m-d' }}"
                            required
                        >

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="submit-button">

                            Update Book

                        </button>


                        <a
                            href="{% url 'book_detail' book.id %}"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


{% endblock %}


{% block extra_js %}

<script>

const form =
    document.getElementById('book-edit-form');

const errorMessage =
    document.getElementById('error-message');

const successMessage =
    document.getElementById('success-message');

const submitButton =
    document.getElementById('submit-button');


form.addEventListener('submit', function(event) {

    event.preventDefault();


    const accessToken =
        localStorage.getItem('access_token');


    if (!accessToken) {

        errorMessage.textContent =
            'You are not authenticated. Please login again.';

        errorMessage.classList.remove('d-none');

        return;
    }


    const bookData = {

        title:
            document.getElementById('title').value,

        author:
            document.getElementById('author').value,

        category:
            document.getElementById('category').value,

        price:
            document.getElementById('price').value,

        published_date:
            document.getElementById('published_date').value
    };


    submitButton.disabled = true;

    submitButton.textContent = 'Updating...';


    const csrfToken =
    document.querySelector(
        '[name=csrfmiddlewaretoken]'
    ).value;

    fetch(
        `/books/{{ book.id }}/`,
        {
            method: 'PATCH',

            headers: {

                'Content-Type':
                    'application/json',

                'Authorization':
                    'Bearer ' + accessToken,

                'X-CSRFToken':
                    csrfToken
            },

            body:
                JSON.stringify(bookData)
        }
    )


    .then(async response => {

        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(data)
            );
        }


        return data;

    })


    .then(data => {

        successMessage.textContent =
            'Book updated successfully!';

        successMessage.classList.remove(
            'd-none'
        );

        errorMessage.classList.add(
            'd-none'
        );


        setTimeout(() => {

            window.location.href =
                "{% url 'book_detail' book.id %}";

        }, 800);

    })


    .catch(error => {

        console.error(error);

        errorMessage.textContent =
            'Failed to update book: ' +
            error.message;

        errorMessage.classList.remove(
            'd-none'
        );

        successMessage.classList.add(
            'd-none'
        );

    })


    .finally(() => {

        submitButton.disabled = false;

        submitButton.textContent =
            'Update Book';

    });

});

</script>

{% endblock %}
